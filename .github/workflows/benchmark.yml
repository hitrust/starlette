---
name: CodSpeed

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      # https://sourceware.org/glibc/manual/latest/html_node/Hardware-Capability-Tunables.html
      # Keep upload buffers above a fixed mmap threshold to reduce heap-dependent realloc copies.
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX512F,-AVX512VL,-AVX512BW,-ERMS,-FSRM:glibc.malloc.mmap_threshold=32768"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install
        shell: bash

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          run: >-
            uv run pytest
            benchmarks/gzip_benchmark.py
            benchmarks/multipart_benchmark.py
            benchmarks/request_benchmark.py
            benchmarks/response_benchmark.py
            benchmarks/routing_benchmark.py
            benchmarks/json_benchmark.py
            benchmarks/file_response_benchmark.py
            benchmarks/streaming_response_benchmark.py
            benchmarks/urlencoded_benchmark.py
            benchmarks/websocket_benchmark.py
            --codspeed
          mode: simulation,memory
